<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Deepfake Detector | AI Forensics Lab</title>

    <!-- مكتبات خارجية -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>

    <!-- خطوط راقية وعصرية -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,700;1,600&family=Dancing+Script:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --hot-pink: #ff1493;
        --rose-gold: #b76e79;
        --blush: #ffb6c1;
        --lavender: #e6e6fa;
        --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        --glass-bg: rgba(255, 255, 255, 0.6);
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(-45deg, #ffdde1, #ee9ca7, #fdfbfb, #f3e8ff);
        background-size: 400% 400%;
        animation: bgShift 15s ease infinite;
        font-family: "Poppins", sans-serif;
        overflow: hidden; /* لمنع السكرول أثناء الحركات */
        color: #333;
      }

      @keyframes bgShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* -------------------------------------
           Particles (Sparkles)
           ------------------------------------- */
      #sparkles-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      .sparkle {
        position: absolute;
        background: white;
        border-radius: 50%;
        box-shadow:
          0 0 10px white,
          0 0 20px var(--hot-pink);
        animation: floatUp linear infinite;
      }

      @keyframes floatUp {
        0% {
          transform: translateY(100vh) scale(0);
          opacity: 0;
        }
        20% {
          opacity: 0.8;
          scale: 1;
        }
        80% {
          opacity: 0.8;
          scale: 1;
        }
        100% {
          transform: translateY(-10vh) scale(0);
          opacity: 0;
        }
      }

      /* -------------------------------------
           Screen Manager (الانتقالات)
           ------------------------------------- */
      .screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        z-index: 10;
      }

      .hidden-screen-intro {
        opacity: 0;
        transform: scale(1.2);
        pointer-events: none;
        filter: blur(10px);
      }

      .hidden-screen-main {
        opacity: 0;
        transform: scale(0.8);
        pointer-events: none;
        filter: blur(10px);
      }

      /* -------------------------------------
           Screen 1: Intro
           ------------------------------------- */
      .intro-box {
        max-width: 800px;
        text-align: center;
        padding: 2rem;
      }

      .intro-title {
        font-family: "Playfair Display", serif;
        font-size: 3.5rem;
        background: linear-gradient(45deg, var(--hot-pink), var(--rose-gold));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 1.5rem;
        opacity: 0;
        animation: fadeInDown 1s ease forwards 0.5s;
      }

      .intro-text-container {
        font-size: 1.2rem;
        line-height: 1.8;
        color: #555;
        min-height: 120px;
        font-weight: 400;
      }

      .cursor {
        display: inline-block;
        width: 3px;
        height: 1.2em;
        background-color: var(--hot-pink);
        vertical-align: middle;
        animation: blink 0.8s infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .btn-start {
        background: linear-gradient(45deg, var(--hot-pink), #ff69b4);
        color: white;
        padding: 15px 50px;
        border-radius: 50px;
        font-size: 1.2rem;
        font-weight: 800;
        border: none;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(255, 20, 147, 0.4);
        transition: 0.3s;
        opacity: 0;
        pointer-events: none;
        transform: translateY(20px);
        display: inline-block;
        margin-top: 2rem;
      }

      .btn-start.show {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
        animation: pulseBtn 2s infinite;
      }

      .btn-start:hover {
        transform: scale(1.1) !important;
        box-shadow: 0 15px 40px rgba(255, 20, 147, 0.6);
      }

      @keyframes pulseBtn {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 20, 147, 0.5);
        }
        70% {
          box-shadow: 0 0 0 20px rgba(255, 20, 147, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(255, 20, 147, 0);
        }
      }

      /* -------------------------------------
           Screen 2: Main App
           ------------------------------------- */
      .glass-app {
        width: 90%;
        max-width: 850px;
        background: var(--glass-bg);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-radius: 40px;
        border: 2px solid rgba(255, 255, 255, 0.8);
        padding: 3rem;
        box-shadow:
          0 20px 50px rgba(255, 182, 193, 0.3),
          inset 0 0 20px rgba(255, 255, 255, 0.5);
        transform-style: preserve-3d;
      }

      .dev-name {
        font-family: "Dancing Script", cursive;
        font-size: 2.2rem;
        background: linear-gradient(90deg, var(--hot-pink), var(--rose-gold));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 700;
      }

      /* منطقة الرفع */
      .upload-area {
        background: rgba(255, 255, 255, 0.5);
        border: 2px dashed var(--blush);
        border-radius: 30px;
        height: 320px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: 0.4s ease;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.7);
      }

      .upload-area:hover {
        background: rgba(255, 255, 255, 0.8);
        border-color: var(--hot-pink);
        transform: scale(1.02);
        box-shadow:
          0 10px 30px rgba(255, 20, 147, 0.15),
          inset 0 0 20px rgba(255, 255, 255, 1);
      }

      /* خط الليزر الوردي */
      .pink-scanner {
        position: absolute;
        width: 100%;
        height: 4px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--hot-pink),
          transparent
        );
        box-shadow: 0 0 20px var(--hot-pink);
        top: 0;
        left: 0;
        display: none;
        animation: girlyScan 2s ease-in-out infinite;
        z-index: 10;
      }

      @keyframes girlyScan {
        0% {
          top: 0%;
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        80% {
          opacity: 1;
        }
        100% {
          top: 100%;
          opacity: 0;
        }
      }

      /* النتيجة المباشرة */
      .result-box {
        display: none;
        text-align: center;
        animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)
          forwards;
      }

      @keyframes bounceIn {
        0% {
          opacity: 0;
          transform: scale(0.5);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .res-text-huge {
        font-size: 5rem;
        font-weight: 800;
        font-family: "Playfair Display", serif;
        line-height: 1;
        margin-bottom: 1rem;
      }

      .loader-girly {
        width: 60px;
        height: 60px;
        border: 4px solid var(--blush);
        border-top: 4px solid var(--hot-pink);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      .btn-reset {
        background: #fff;
        color: var(--hot-pink);
        border: 2px solid var(--hot-pink);
        padding: 10px 30px;
        border-radius: 30px;
        font-weight: 700;
        text-transform: uppercase;
        transition: 0.3s;
        cursor: pointer;
      }

      .btn-reset:hover {
        background: var(--hot-pink);
        color: #fff;
        box-shadow: 0 5px 15px rgba(255, 20, 147, 0.3);
      }
    </style>
  </head>
  <body>
    <!-- جزيئات اللمعان في الخلفية -->
    <div id="sparkles-container"></div>

    <!-- ==============================================
         الشاشة الأولى: شاشة الترحيب (Intro Screen)
         ============================================== -->
    <div id="screen-intro" class="screen">
      <div class="intro-box">
        <h1 class="intro-title">AI Deepfake Detector</h1>
        <div class="intro-text-container">
          <span id="typed-text"></span><span class="cursor"></span>
        </div>
        <button id="btn-start" class="btn-start" onclick="startApp()">
          Start Magic ✨
        </button>
      </div>
    </div>

    <!-- ==============================================
         الشاشة الثانية: شاشة التطبيق (Main Screen)
         ============================================== -->
    <div id="screen-main" class="screen hidden-screen-main">
      <div
        class="glass-app"
        data-tilt
        data-tilt-max="3"
        data-tilt-speed="1000"
        data-tilt-glare
        data-tilt-max-glare="0.2"
      >
        <!-- الترويسة -->
        <div class="flex justify-between items-center mb-8">
          <div>
            <h2 class="text-2xl font-black text-gray-800 tracking-tight">
              Deepfake Detector
            </h2>
            <p
              class="text-xs text-pink-500 font-bold uppercase tracking-widest"
            >
              Neural Analysis
            </p>
          </div>
          <div class="text-right">
            <span class="dev-name block leading-none">AI Forensics Lab</span>
            <span
              class="text-[10px] text-gray-400 font-bold uppercase tracking-widest bg-white/50 px-3 py-1 rounded-full shadow-sm mt-1 inline-block"
              >Engine: ResNet-50</span
            >
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10 items-center">
          <!-- منطقة الرفع -->
          <div>
            <div class="upload-area" id="drop-area">
              <input type="file" id="file-input" hidden accept="image/*" />

              <div
                id="drop-content"
                class="text-center transition-all duration-300"
                style="transform: translateZ(20px)"
              >
                <div
                  class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-[0_5px_15px_rgba(255,20,147,0.2)]"
                >
                  <span class="text-3xl">🎀</span>
                </div>
                <p class="text-lg font-bold text-gray-700">Upload Portrait</p>
                <p
                  class="text-xs font-semibold text-pink-400 mt-1 uppercase tracking-widest"
                >
                  Tap or Drop Image
                </p>
              </div>

              <div id="scanner" class="pink-scanner"></div>
              <img
                id="preview-img"
                class="hidden w-full h-full object-cover rounded-[28px] p-2"
                alt="Subject"
              />
            </div>
          </div>

          <!-- منطقة النتائج -->
          <div class="flex flex-col justify-center min-h-[250px]">
            <div
              id="idle-msg"
              class="text-center p-8 bg-white/40 rounded-3xl border border-white"
            >
              <p class="text-gray-500 font-medium italic">
                Awaiting your stunning photo...
              </p>
            </div>

            <!-- اللودر -->
            <div id="loading-state" class="hidden text-center space-y-4">
              <div class="loader-girly"></div>
              <p
                class="text-sm font-black text-pink-500 tracking-[0.2em] uppercase animate-pulse"
              >
                Analyzing...
              </p>
            </div>

            <!-- النتيجة المباشرة -->
            <div id="result-stage" class="result-box">
              <h2 id="res-title" class="res-text-huge"></h2>
              <div
                class="bg-white/60 border border-white rounded-2xl p-4 mb-6 shadow-sm"
              >
                <span
                  class="text-[10px] text-gray-400 uppercase tracking-[0.2em] font-bold"
                  >Confidence</span
                >
                <p id="res-prob" class="text-2xl font-black text-gray-700"></p>
              </div>
              <button class="btn-reset w-full" onclick="resetApp()">
                Scan Another 💖
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ==========================================
      // 1. إنشاء تأثير النجوم (Sparkles)
      // ==========================================
      function createSparkles() {
        const container = document.getElementById("sparkles-container");
        const sparkle = document.createElement("div");
        sparkle.className = "sparkle";
        const size = Math.random() * 4 + 2;
        sparkle.style.width = `${size}px`;
        sparkle.style.height = `${size}px`;
        sparkle.style.left = `${Math.random() * 100}vw`;
        sparkle.style.animationDuration = `${Math.random() * 4 + 3}s`;
        container.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 7000);
      }
      setInterval(createSparkles, 200);

      // ==========================================
      // 2. تأثير الآلة الكاتبة للشاشة الأولى (Typewriter)
      // ==========================================
      const introText =
        "Discover the truth behind the pixels. Our advanced AI scans portraits to separate authentic real faces (REAL) from synthetic deepfake manipulations (FAKE). Upload to begin";
      const typedTextElement = document.getElementById("typed-text");
      const startBtn = document.getElementById("btn-start");
      let i = 0;

      function typeWriter() {
        if (i < introText.length) {
          typedTextElement.innerHTML += introText.charAt(i);
          i++;
          setTimeout(typeWriter, 35); // سرعة الكتابة
        } else {
          // بعد الانتهاء، إظهار الزر
          startBtn.classList.add("show");
        }
      }

      // بدء الكتابة عند تحميل الصفحة
      window.onload = () => {
        setTimeout(typeWriter, 1000);
      };

      // ==========================================
      // 3. الانتقال بين الشاشات (Screen Transition)
      // ==========================================
      function startApp() {
        const screenIntro = document.getElementById("screen-intro");
        const screenMain = document.getElementById("screen-main");

        // إخفاء الأولى وإظهار الثانية
        screenIntro.classList.add("hidden-screen-intro");
        screenMain.classList.remove("hidden-screen-main");
      }

      // ==========================================
      // 4. منطق التطبيق ورفع الصور (App Logic)
      // ==========================================
      const dropArea = document.getElementById("drop-area");
      const fileInput = document.getElementById("file-input");
      const previewImg = document.getElementById("preview-img");
      const scanner = document.getElementById("scanner");
      const dropContent = document.getElementById("drop-content");
      const loadingState = document.getElementById("loading-state");
      const idleMsg = document.getElementById("idle-msg");
      const resultStage = document.getElementById("result-stage");
      const resTitle = document.getElementById("res-title");
      const resProb = document.getElementById("res-prob");

      dropArea.onclick = () => fileInput.click();
      fileInput.onchange = (e) => handleUpload(e.target.files[0]);

      function handleUpload(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
          // UI Changes
          dropContent.style.display = "none";
          previewImg.src = reader.result;
          previewImg.classList.remove("hidden");

          scanner.style.display = "block";
          idleMsg.classList.add("hidden");
          loadingState.classList.remove("hidden");
          resultStage.style.display = "none";

          startAnalysis(file);
        };
      }

      async function startAnalysis(file) {
        const formData = new FormData();
        formData.append("file", file);

        try {
          // الاتصال بـ server.py (الـ Model بتاعك)
          const response = await fetch("http://localhost:5000/predict", {
            method: "POST",
            body: formData,
          });
          const data = await response.json();

          // تأخير بسيط لمحاكاة التحليل العميق
          setTimeout(() => {
            displayOutput(data);
          }, 2500);
        } catch (err) {
          console.error(err);
          alert(
            "Connection failed! Make sure server.py is running on port 5000.",
          );
          resetApp();
        }
      }

      function displayOutput(data) {
        scanner.style.display = "none";
        loadingState.classList.add("hidden");
        resultStage.style.display = "block";

        if (data.label === "AUTHENTIC") {
          // تصميم النتيجة REAL
          resTitle.innerText = "REAL";
          resTitle.style.color = "#10b981"; // لون أخضر حيوي
          resProb.innerText = `${data.confidence}%`;

          confetti({
            particleCount: 150,
            spread: 80,
            origin: { y: 0.6 },
            colors: ["#ff1493", "#10b981", "#ffffff"],
          });
        } else {
          // تصميم النتيجة FAKE
          resTitle.innerText = "FAKE";
          resTitle.style.color = "#ff1493"; // لون وردي فاقع (Hot Pink)
          resProb.innerText = `${data.confidence}%`;
        }
      }

      function resetApp() {
        dropContent.style.display = "block";
        previewImg.classList.add("hidden");
        previewImg.src = "";
        resultStage.style.display = "none";
        idleMsg.classList.remove("hidden");
        fileInput.value = "";
      }

      // ==========================================
      // 5. تفعيل تأثير 3D (Vanilla Tilt)
      // ==========================================
      VanillaTilt.init(document.querySelectorAll(".glass-app"), {
        max: 3,
        speed: 1000,
        glare: true,
        "max-glare": 0.2,
        scale: 1.02,
      });
    </script>
  </body>
</html>
